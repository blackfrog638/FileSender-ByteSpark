schema_version: 1
project: xnn-transfer
purpose: multi-agent engineering harness

source_of_truth:
  instructions: AGENTS.md
  backlog: .agents/backlog.yaml
  architecture: docs/architecture.md
  roadmap: docs/roadmap.md
  decisions: docs/adr
  protocol: protocol/spec

commands:
  doctor: make doctor
  bootstrap: make bootstrap
  verify: make verify
  native_test: make native-test
  flutter_test: make flutter-test
  security_test: make security-test
  benchmark: make benchmark
  agent_list: tool/harness/agent.sh list

workstreams:
  integration:
    owns:
      - AGENTS.md
      - .agents/**
      - tool/harness/**
      - .github/workflows/**
      - CMakeLists.txt
      - Makefile
      - apps/desktop/linux/**
      - apps/desktop/macos/**
      - apps/desktop/windows/**
  native_core:
    owns:
      - native/include/xnn_transfer/core/**
      - native/src/core/**
      - native/tests/core/**
      - native/benchmarks/**
      - native/fuzz/core/**
  native_bridge:
    owns:
      - native/include/xnn_transfer/c_api.h
      - native/src/bridge/**
      - native/tests/native_tests.cpp
      - native/tests/bridge/**
      - native/fuzz/c_api_fuzzer.cpp
      - apps/desktop/lib/core/native/**
  flutter_desktop:
    owns:
      - apps/desktop/lib/app/**
      - apps/desktop/lib/features/**
      - apps/desktop/test/features/**
      - apps/desktop/pubspec.yaml
  protocol:
    owns:
      - protocol/**
      - docs/adr/*protocol*
  documentation:
    owns:
      - README.md
      - docs/architecture.md
      - docs/roadmap.md
      - docs/testing.md

shared_contracts:
  - native/include/xnn_transfer/c_api.h
  - protocol/spec/**
  - apps/desktop/pubspec.yaml

quality_gates:
  required:
    - no whitespace errors
    - repository layout check
    - native build and tests
    - flutter static analysis and tests
  policy: A missing tool reports a skipped local gate; CI must run all gates.
