schema_version: 1
project: xnn-transfer
purpose: multi-agent engineering harness

source_of_truth:
  instructions: AGENTS.md
  backlog: .agents/backlog.yaml
  task_specs: .agents/tasks
  task_records: .agents/records
  module_inventory: .agents/architecture/modules.json
  architecture: docs/architecture.md
  roadmap: docs/roadmap.md
  decisions: docs/adr
  protocol: protocol/spec

integration_branch: harness

commands:
  abi_compat_test: make abi-compat-test
  architecture_test: make architecture-test
  cmake_dev_configure: cmake --preset dev -S .
  desktop_bundle_test: tool/harness/desktop_bundle_test.sh
  diff_check: git diff --check
  discovery_vectors: python3 protocol/testdata/discovery/v1/validate_vectors.py
  doctor: make doctor
  bootstrap: make bootstrap
  verify: make verify
  flutter_analyze: flutter analyze
  flutter_raw_test: flutter test
  native_test: make native-test
  flutter_test: make flutter-test
  security_test: make security-test
  security_vectors: python3 protocol/testdata/security/v1/validate_vectors.py
  security_wordlist_test: python3 protocol/testdata/security/v1/test_wordlist_line_endings.py
  protocol_vectors: python3 protocol/testdata/v1/validate_vectors.py
  manifest_vectors: python3 protocol/testdata/v1/manifest/validate_vectors.py
  benchmark: make benchmark
  clangd_check: clangd --check=native/src/core/engine.cpp
  dependency_test: make dependency-test
  commit_message_test: make commit-message-test
  vcpkg_bootstrap: make vcpkg-bootstrap
  agent_list: tool/harness/agent.sh list
  governance_test: make governance-test

workstreams:
  integration:
    owns:
      - AGENTS.md
      - .agents/**
      - tool/harness/**
      - .github/workflows/**
      - CMakeLists.txt
      - Makefile
      - docs/adr/**
      - apps/desktop/linux/**
      - apps/desktop/macos/**
      - apps/desktop/windows/**
  native_core:
    owns:
      - native/include/xnn_transfer/core/**
      - native/src/core/**
      - native/tests/core/**
      - native/benchmarks/**
      - native/fuzz/core/**
  native_bridge:
    owns:
      - native/include/xnn_transfer/c_api.h
      - native/src/bridge/**
      - native/tests/native_tests.cpp
      - native/tests/bridge/**
      - native/fuzz/c_api_fuzzer.cpp
      - apps/desktop/lib/core/native/**
  flutter_desktop:
    owns:
      - apps/desktop/lib/app/**
      - apps/desktop/lib/features/**
      - apps/desktop/test/features/**
      - apps/desktop/pubspec.yaml
  protocol:
    owns:
      - protocol/**
  documentation:
    owns:
      - README.md
      - docs/architecture.md
      - docs/roadmap.md
      - docs/testing.md

shared_contracts:
  - native/include/xnn_transfer/c_api.h
  - protocol/spec/**
  - apps/desktop/pubspec.yaml
  - docs/adr/**

quality_gates:
  required:
    - no whitespace errors
    - meaningful Conventional Commit messages
    - repository layout check
    - architecture dependency direction
    - canonical module replacement and temporary-code leases
    - C ABI v1 compatibility
    - task governance and integration provenance
    - trusted verification gate resolution
    - immutable post-review payload
    - native build and tests
    - flutter static analysis and tests
  policy: A missing tool reports a skipped local gate; CI must run all gates.
