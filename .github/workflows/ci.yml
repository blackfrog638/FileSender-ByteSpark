name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - harness
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/out/vcpkg-cache
  VCPKG_DISABLE_METRICS: "1"

jobs:
  commit-policy:
    name: Commit message policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate pushed commit range
        env:
          RANGE_BASE: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGE_HEAD: >-
            ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$RANGE_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse "$RANGE_HEAD^")"
          fi
          XNN_TRANSFER_COMMIT_BASE="$base" \
            XNN_TRANSFER_COMMIT_HEAD="$RANGE_HEAD" \
            make commit-message-test

  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Dependency build tools
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y \
              autoconf autoconf-archive automake dbus-x11 gnome-keyring \
              libtool ninja-build pkg-config
          else
            brew install pkgconf
          fi

      - name: Dependency cache identity
        id: dependency-key
        shell: bash
        run: |
          identity="${ImageOS:-$RUNNER_OS}-${ImageVersion:-unknown}"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: out/vcpkg-cache
          key: >-
            vcpkg-${{ matrix.os }}-${{ runner.arch }}-
            ${{ steps.dependency-key.outputs.identity }}-
            ${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json',
            'cmake/dependencies/versions.json', 'cmake/vcpkg-overlay/**',
            'cmake/triplets/**') }}

      - name: Bootstrap pinned vcpkg
        shell: bash
        run: tool/harness/vcpkg_bootstrap.sh

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B out/build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DXNN_TRANSFER_BUILD_TESTS=ON

      - name: Configure (Windows MSVC)
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B out/build/ci
          -G "Visual Studio 17 2022" -A x64
          -DXNN_TRANSFER_BUILD_TESTS=ON

      - name: Build
        run: cmake --build out/build/ci --config Debug

      - name: ABI v1 compatibility
        run: >-
          ctest --test-dir out/build/ci
          -C Debug
          --output-on-failure
          --no-tests=error
          -R '^xnn_transfer_abi_'

      - name: Pinned dependency probe
        run: >-
          ctest --test-dir out/build/ci
          -C Debug
          --output-on-failure
          --no-tests=error
          -R '^xnn_transfer_dependency_probe$'

      - name: Test
        run: >-
          ctest --test-dir out/build/ci
          -C Debug
          --output-on-failure
          --no-tests=error

  linux-secret-service:
    name: Linux GNOME Keyring qualification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Qualified service and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf-archive automake dbus-x11 gnome-keyring \
            libtool ninja-build pkg-config
          test "$(readlink -f "$(command -v gnome-keyring-daemon)")" = \
            /usr/bin/gnome-keyring-daemon
          gnome-keyring-daemon --version

      - name: Dependency cache identity
        id: dependency-key
        shell: bash
        run: |
          identity="${ImageOS:-$RUNNER_OS}-${ImageVersion:-unknown}"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: out/vcpkg-cache
          key: >-
            vcpkg-linux-secret-service-${{ runner.arch }}-
            ${{ steps.dependency-key.outputs.identity }}-
            ${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json',
            'cmake/dependencies/versions.json', 'cmake/vcpkg-overlay/**',
            'cmake/triplets/**') }}

      - name: Bootstrap pinned vcpkg
        shell: bash
        run: tool/harness/vcpkg_bootstrap.sh

      - name: Configure
        run: >-
          cmake -S . -B out/build/linux-secret-service -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DXNN_TRANSFER_BUILD_TESTS=ON

      - name: Build qualification target
        run: >-
          cmake --build out/build/linux-secret-service
          --target xnn_transfer_platform_protected_store_tests

      - name: Real GNOME Keyring lifecycle
        run: >-
          ctest --test-dir out/build/linux-secret-service
          --output-on-failure
          --no-tests=error
          -R '^xnn_transfer_linux_secret_service_integration_tests$'

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: apps/desktop
        run: flutter pub get

      - name: Format
        working-directory: apps/desktop
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: apps/desktop
        run: flutter analyze

      - name: Test
        working-directory: apps/desktop
        run: flutter test

  desktop-packaging:
    name: Desktop native bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          # Flutter 3.32 recognizes Visual Studio 2022, while windows-latest
          # currently resolves to a VS 2026 image and selects the wrong CMake
          # generator.
          - windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Dependency build tools
        if: runner.os == 'macOS'
        run: brew install pkgconf

      - name: Dependency cache identity
        id: dependency-key
        shell: bash
        run: |
          identity="${ImageOS:-$RUNNER_OS}-${ImageVersion:-unknown}"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: out/vcpkg-cache
          key: >-
            vcpkg-desktop-${{ matrix.os }}-${{ runner.arch }}-
            ${{ steps.dependency-key.outputs.identity }}-
            ${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json',
            'cmake/dependencies/versions.json', 'cmake/vcpkg-overlay/**',
            'cmake/triplets/**') }}

      - name: Bootstrap pinned vcpkg
        shell: bash
        run: tool/harness/vcpkg_bootstrap.sh

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf-archive automake clang cmake libgtk-3-dev \
            libtool ninja-build pkg-config

      - name: Dependencies
        working-directory: apps/desktop
        run: flutter pub get

      - name: Build and load native library (Debug and Release)
        shell: bash
        run: tool/harness/desktop_bundle_test.sh

  native-security:
    name: Native ASan, UBSan, and fuzz smoke
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      XNN_TRANSFER_FUZZ_SECONDS: >-
        ${{ github.event_name == 'schedule' && '300' || '15' }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependency build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf-archive automake dbus-x11 gnome-keyring \
            libtool ninja-build pkg-config

      - name: Dependency cache identity
        id: dependency-key
        shell: bash
        run: |
          identity="${ImageOS:-$RUNNER_OS}-${ImageVersion:-unknown}"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: out/vcpkg-cache
          key: >-
            vcpkg-security-${{ runner.os }}-${{ runner.arch }}-
            ${{ steps.dependency-key.outputs.identity }}-
            ${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json',
            'cmake/dependencies/versions.json', 'cmake/vcpkg-overlay/**',
            'cmake/triplets/**') }}

      - name: Bootstrap pinned vcpkg
        shell: bash
        run: tool/harness/vcpkg_bootstrap.sh

      - name: Security tests
        run: make security-test

  harness:
    name: Harness contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shell syntax
        run: find tool/harness -type f -name '*.sh' -exec bash -n {} \;

      - name: Layout
        run: tool/harness/check_layout.sh

      - name: Architecture dependencies
        run: make architecture-test

      - name: Whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git diff --check HEAD^..HEAD
          fi

      - name: Agent contracts
        run: tool/harness/agent.sh validate

      - name: Governance lifecycle
        run: make governance-test
