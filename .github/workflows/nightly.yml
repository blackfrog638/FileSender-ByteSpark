name: Harness V2 Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-repository:
    name: Full repository verification
    runs-on: ubuntu-latest
    env:
      STRICT_TOOLS: "1"
      XNN_TRANSFER_FUZZ_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf-archive automake clang cmake dbus-x11 \
            gnome-keyring libgtk-3-dev libtool ninja-build pkg-config

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true

      - name: V2 adversarial and recovery tests
        run: make harness-v2-test

      - name: Full repository gates
        run: make verify

      - name: Long security campaign
        run: make security-test
