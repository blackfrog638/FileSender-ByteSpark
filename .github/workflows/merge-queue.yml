name: Harness V2 Merge Queue

on:
  push:
    branches:
      - "queue/**"

permissions:
  contents: read

jobs:
  candidate-plan:
    name: Candidate plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate contracts
        run: python3 -B tool/harness/agent.py --local validate

      - name: Resolve risk matrix
        id: plan
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == queue/bootstrap/* ]]; then
            matrix='{"include":[{"runner":"ubuntu-latest","label":"linux"},{"runner":"macos-latest","label":"macos"},{"runner":"windows-2022","label":"windows"}]}'
          else
            matrix="$(python3 -B tool/harness/agent.py matrix)"
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  harness-v2:
    name: Harness V2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile Harness
        run: python3 -m compileall -q tool/harness

      - name: Harness contracts and adversarial tests
        run: make harness-v2-test

      - name: Commit policy
        env:
          XNN_TRANSFER_COMMIT_BASE: ${{ github.event.before }}
          XNN_TRANSFER_COMMIT_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$XNN_TRANSFER_COMMIT_BASE" =~ ^0+$ ]]; then
            git fetch --no-tags origin harness
            XNN_TRANSFER_COMMIT_BASE="$(git merge-base origin/harness HEAD)"
            export XNN_TRANSFER_COMMIT_BASE
          fi
          make commit-message-test

  product-gates:
    name: Product gates (${{ matrix.label }})
    needs:
      - candidate-plan
      - harness-v2
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf-archive automake dbus-x11 gnome-keyring \
            libgtk-3-dev libtool ninja-build pkg-config

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install pkgconf

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true

      - name: Execute exact candidate Gate plan
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == queue/bootstrap/* ]]; then
            python3 -B tool/harness/agent.py verify-all \
              --no-cache \
              --platform "${{ matrix.label }}" \
              --output out/candidate-evidence/evidence.json
          else
            python3 -B tool/harness/agent.py verify \
              --phase queue \
              --platform "${{ matrix.label }}" \
              --output out/candidate-evidence/evidence.json
          fi

      - name: Upload exact candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: candidate-evidence-${{ matrix.label }}
          path: out/candidate-evidence/evidence.json
          if-no-files-found: error
          retention-days: 14

  cutover-security:
    name: Cutover security
    if: startsWith(github.ref_name, 'queue/bootstrap/')
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      XNN_TRANSFER_FUZZ_SECONDS: "15"
    steps:
      - uses: actions/checkout@v4

      - name: Install security build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf-archive automake dbus-x11 gnome-keyring \
            libtool ninja-build pkg-config

      - name: Bootstrap pinned vcpkg
        shell: bash
        run: tool/harness/vcpkg_bootstrap.sh

      - name: Sanitizer and fuzz Gate
        run: make security-test
